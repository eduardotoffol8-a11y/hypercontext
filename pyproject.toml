[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercontext"
version = "0.2.0"
description = "Educational provider-native prompt caching and token usage accounting for text conversations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Eduardo" }
]
keywords = [
    "llm",
    "prompt-caching",
    "claude",
    "anthropic",
    "openai",
    "kv-cache"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/eduardotoffol8-a11y/hypercontext"
Repository = "https://github.com/eduardotoffol8-a11y/hypercontext.git"
Issues = "https://github.com/eduardotoffol8-a11y/hypercontext/issues"

[tool.setuptools]
py-modules = ["caching_client"]
