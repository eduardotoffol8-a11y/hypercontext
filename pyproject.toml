[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercontext"
version = "0.1.0"
description = "High-performance context compaction and prompt-caching orchestration engine for multi-turn LLM agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "AI Systems Engineering Lab" }
]
keywords = [
    "llm",
    "prompt-caching",
    "context-pruner",
    "autonomous-agents",
    "claude",
    "anthropic",
    "openai",
    "ast",
    "kv-cache"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/your-username/hypercontext"
Repository = "https://github.com/your-username/hypercontext.git"
Issues = "https://github.com/your-username/hypercontext/issues"
